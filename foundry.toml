[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.35"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
    "@superfluid-finance/ethereum-contracts/contracts/=lib/protocol-monorepo/packages/ethereum-contracts/contracts/",
    "@superfluid-finance/solidity-semantic-money/src/=lib/protocol-monorepo/packages/solidity-semantic-money/src/",
    "@openzeppelin-v5/=lib/protocol-monorepo/lib/openzeppelin-contracts/",
    "@openzeppelin/contracts/=lib/protocol-monorepo/lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
optimism_sepolia = "${OP_SEPOLIA_RPC_URL}"
optimism = "${OP_MAINNET_RPC_URL}"

[etherscan]
optimism_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155420 }
optimism = { key = "${ETHERSCAN_API_KEY}", chain = 10 }

[fmt]
bracket_spacing = true
line_length = 120
int_types = "preserve"
